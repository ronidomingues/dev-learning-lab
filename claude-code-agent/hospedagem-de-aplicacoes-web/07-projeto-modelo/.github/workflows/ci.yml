name: ci
on:
  push:    { branches: [main] }
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: hospedagem-de-aplicacoes-web/07-projeto-modelo }

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: app
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
      valkey:
        image: valkey/valkey:9
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - run: npm install            # sem lockfile versionado neste material didático
      - run: npm test               # 40 testes, sem depender de serviço externo

      - name: Migrar e rodar os testes de integração
        env:
          DATABASE_URL: postgresql://app:teste@localhost:5432/app
          REDIS_URL: redis://localhost:6379
          INTEGRACAO: "1"
        run: |
          npm run migrate
          npm run test:integracao
