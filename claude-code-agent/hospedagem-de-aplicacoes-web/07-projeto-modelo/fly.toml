# Fly.io — a plataforma de container mais barata COM região no Brasil (gru = São Paulo).
# Não há camada gratuita desde 2024; o custo desta configuração fica em torno de
# US$ 2 a 4/mês se a máquina ficar suspensa a maior parte do tempo.
app = "encurtalink"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"   # congela a memória: retorno em centenas de ms
  auto_start_machines = true
  min_machines_running = 0         # troque para 1 se cold start for inaceitável

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
