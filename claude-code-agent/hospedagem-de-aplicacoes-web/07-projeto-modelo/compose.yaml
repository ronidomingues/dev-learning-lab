# Ambiente local completo: API + PostgreSQL + Valkey.
#   docker compose up --build
#   docker compose exec api npm run migrate
#   http://localhost:3000
name: encurtalink

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev_senha_local     # senha local; NUNCA reutilize em produção
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: valkey/valkey:9
    # Cache puro: sem persistência, com teto de memória e descarte LRU.
    command: ["valkey-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://app:dev_senha_local@db:5432/app
      REDIS_URL: redis://cache:6379
      BASE_URL: http://localhost:3000
      PORT: "3000"
      RATE_LIMITE: "20"
    ports: ["3000:3000"]
    depends_on:
      db:    { condition: service_healthy }
      cache: { condition: service_healthy }

volumes:
  pgdata:
