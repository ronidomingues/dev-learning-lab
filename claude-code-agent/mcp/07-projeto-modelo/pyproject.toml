[project]
name = "biblioteca-mcp"
version = "1.0.0"
description = "Servidor MCP de uma biblioteca: consultar acervo, emprestar e devolver livros."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biblioteca"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["testes"]
