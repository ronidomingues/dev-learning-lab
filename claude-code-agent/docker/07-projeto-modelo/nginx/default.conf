# nginx/default.conf — proxy reverso na frente da api.
#
# Por que existe um proxy num projeto tão pequeno: é o padrão que você vai reencontrar em
# qualquer implantação real. Ele termina a conexão do cliente, esconde a topologia interna,
# comprime, aplica cabeçalhos de segurança e permite trocar/escalar a api sem que o cliente perceba.

upstream api {
    # 'api' é o NOME DO SERVIÇO no compose.yaml. O DNS embutido do Docker (127.0.0.11)
    # resolve esse nome para o IP do container. Nunca use IP fixo aqui: ele muda a cada recriação.
    # Com múltiplas réplicas, o DNS devolve vários IPs e o nginx faz round-robin.
    server api:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Não anuncie a versão do nginx: informação gratuita para quem está sondando.
    server_tokens off;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 512;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout   30s;
    }

    # Healthcheck do proxy não polui o log de acesso.
    location /saude {
        access_log off;
        proxy_pass http://api/saude;
    }
}
