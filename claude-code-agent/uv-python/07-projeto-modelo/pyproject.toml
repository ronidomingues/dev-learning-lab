[project]
name = "lockspect"
version = "0.1.0"
description = "Inspeciona um arquivo uv.lock e explica o que há dentro dele."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "learn-process" }]
keywords = ["uv", "lockfile", "dependencies"]

dependencies = [
    "rich>=13.0",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
grafo = ["graphviz>=0.20"]

[project.scripts]
lockspect = "lockspect.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.9"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
